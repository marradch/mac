security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

    access_control:
        - { path: ^/api/auth/register$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/verify-email$, roles: PUBLIC_ACCESS }
        - { path: ^/api/exercises-home/[^/]+$, roles: PUBLIC_ACCESS }
        - { path: ^/api/exercises/[^/]+(?:/.*)?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/topics-home/[^/]+$, roles: PUBLIC_ACCESS }
        - { path: ^/api/topics/[^/]+(?:/.*)?$, roles: PUBLIC_ACCESS }
        - { path: ^/api/decks/[^/]+$, roles: PUBLIC_ACCESS }
        - { path: ^/api/question/[^/]+$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
